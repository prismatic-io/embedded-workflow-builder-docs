name: Sync connector docs
on:
  schedule:
    # 09:00 UTC on the first of every month
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-connector-docs
  cancel-in-progress: false

jobs:
  sync-connector-docs:
    runs-on: ubuntu-latest
    steps:
      # The generator reads connector descriptions from ../components relative
      # to this repo, so both repos must be checked out side by side.
      - name: Check out docs repository
        uses: actions/checkout@v4
        with:
          path: embedded-workflow-builder-docs
      - name: Check out components repository
        uses: actions/checkout@v4
        with:
          repository: prismatic-io/components
          path: components
          fetch-depth: 1
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: embedded-workflow-builder-docs/package-lock.json
      - name: Install dependencies
        working-directory: embedded-workflow-builder-docs
        run: npm ci
      - name: Install Prism CLI
        run: npm install --global @prismatic-io/prism
      - name: Copy example site config
        working-directory: embedded-workflow-builder-docs
        run: cp -R site-config.example site-config
      - name: Generate Prismatic access token
        env:
          PRISM_REFRESH_TOKEN: ${{ secrets.PRISM_REFRESH_TOKEN }}
        run: |
          token="$(prism me:token)"
          if [ -z "$token" ]; then
            echo "::error::prism me:token returned an empty token"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "PRISMATIC_API_KEY=$token" >> "$GITHUB_ENV"
      - name: Generate public connector docs
        working-directory: embedded-workflow-builder-docs
        run: make generate-public-connector-docs
      - name: Determine PR details
        id: details
        run: |
          echo "month=$(date -u +'%B %Y')" >> "$GITHUB_OUTPUT"
          echo "branch=sync-connector-docs/$(date -u +'%Y-%m')" >> "$GITHUB_OUTPUT"
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          path: embedded-workflow-builder-docs
          branch: ${{ steps.details.outputs.branch }}
          delete-branch: true
          commit-message: Sync connector docs for ${{ steps.details.outputs.month }}
          title: Sync connector docs for ${{ steps.details.outputs.month }}
          body: |
            Automated monthly sync of public connector docs, generated by running
            `make generate-public-connector-docs` against the latest
            [prismatic-io/components](https://github.com/prismatic-io/components) `main`.

            Triggered by the [Sync connector docs workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
